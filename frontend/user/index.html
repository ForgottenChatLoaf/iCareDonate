<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      if (!document.querySelector('base')) {
        var p = window.location.pathname;
        var isSub = p.includes('/admin') || p.includes('/user');
        if (isSub) {
          var f = p.includes('/admin') ? 'admin' : 'user';
          var i = p.indexOf('/' + f);
          var b = document.createElement('base');
          b.href = window.location.origin + p.substring(0, i) + '/' + f + '/';
          document.head.prepend(b);
        }
      }
    })();
  </script>
  <meta charset="UTF-8">
  <title>Redirecting — iCareDonate User Portal</title>
  <meta http-equiv="refresh" content="0; url=dashboard.html">
  <script>window.location.replace('dashboard.html');</script>
</head>
<body>
  <p>Redirecting to <a href="dashboard.html">User Dashboard</a>...</p>
</body>
</html>
