<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Management — iCareDonate Admin</title>
  <meta name="theme-color" content="#1F4FA3">
  <script>
    document.documentElement.setAttribute('data-theme', 'light');
    (function() {
      if (!document.querySelector('base')) {
        var p = window.location.pathname;
        if (p.includes('/admin')) {
          var i = p.indexOf('/admin');
          var b = document.createElement('base');
          b.href = window.location.origin + p.substring(0, i) + '/admin/';
          document.head.prepend(b);
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="user-sidebar admin-sidebar" role="complementary" aria-label="Admin navigation">
    <div class="brand-sidebar-container" role="banner">
      <a href="index.html" class="brand-sidebar-logo">
        <img src="../assets/images/logo.svg" class="brand-sidebar-icon" alt="iCareDonate Logo" width="32" height="32">
        <span class="brand-sidebar-wordmark"><span class="brand-split-blue">i</span><span class="brand-split-orange">Care</span><span class="brand-split-blue">Donate</span></span>
      </a>
      <span class="brand-sidebar-badge brand-sidebar-badge--admin">ADMIN</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>Dashboard</span></a>
      <a href="donations.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7"/><line x1="12" x2="12" y1="22" y2="7"/></svg><span>Donation Review</span></a>
      <a href="requests.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Request Review</span></a>
      <a href="matches.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></svg><span>Resource Matching</span></a>
      <a href="campaigns.html" class="sidebar-link sidebar-link--active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg><span>Campaigns</span></a>
      <a href="statistics.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Statistics</span></a>
      <a href="../logout.html" class="sidebar-link sidebar-link--logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y2="12"/></svg><span>Logout</span></a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button type="button" class="admin-sidebar-toggle" id="adminSidebarToggle" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="admin-topbar__title" style="margin:0;font-size:19px;font-weight:700;">Campaigns &amp; Community Milestones</h1>
      </div>
      <button type="button" class="btn btn-primary" onclick="document.getElementById('camp-dialog').showModal()" style="font-size:13px;padding:7px 14px;">+ New Campaign</button>
    </header>
    <div class="admin-content" style="padding:24px 28px;">
      <div class="card" style="padding:0;overflow:hidden;border:1px solid #E2E8F0;border-radius:12px;background:#fff;">
        <div style="overflow-x:auto;">
          <table class="table" style="width:100%;margin:0;border-collapse:collapse;font-size:13px;">
            <thead style="background:#F8FAFC;border-bottom:1px solid #E2E8F0;">
              <tr>
                <th style="padding:12px 14px;text-align:left;">Campaign</th>
                <th style="padding:12px 14px;text-align:left;">Category</th>
                <th style="padding:12px 14px;text-align:left;">Verified Progress</th>
                <th style="padding:12px 14px;text-align:left;">Dates</th>
                <th style="padding:12px 14px;text-align:left;">Status</th>
                <th style="padding:12px 14px;text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="campaigns-tbody">
              <tr><td colspan="6" style="padding:28px;text-align:center;color:#64748B;">Loading campaigns...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<dialog id="camp-dialog" style="border:none;border-radius:14px;padding:0;background:transparent;max-width:480px;width:92%;">
  <div class="card" style="padding:24px;background:#fff;border-radius:14px;border:1px solid #E2E8F0;">
    <h3 style="margin:0 0 14px;font-size:16px;font-weight:700;">Create Community Campaign</h3>
    <form id="camp-form">
      <div style="margin-bottom:10px;"><label style="display:block;font-size:12px;font-weight:700;">Title *</label><input id="c-title" class="form-input" style="width:100%;height:36px;" required minlength="3"></div>
      <div style="margin-bottom:10px;"><label style="display:block;font-size:12px;font-weight:700;">Description</label><textarea id="c-desc" class="form-input" rows="2" style="width:100%;"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="display:block;font-size:12px;font-weight:700;">Target Quantity *</label><input id="c-target" type="number" min="1" value="100" class="form-input" style="width:100%;height:36px;" required></div>
        <div><label style="display:block;font-size:12px;font-weight:700;">Unit</label><input id="c-unit" value="items" class="form-input" style="width:100%;height:36px;"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        <div><label style="display:block;font-size:12px;font-weight:700;">Start Date</label><input id="c-start" type="date" class="form-input" style="width:100%;height:36px;"></div>
        <div><label style="display:block;font-size:12px;font-weight:700;">End Date</label><input id="c-end" type="date" class="form-input" style="width:100%;height:36px;"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('camp-dialog').close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Campaign</button>
      </div>
    </form>
  </div>
</dialog>

<script src="../js/admin-portal.js"></script>
<script>
function getBase() {
  if (window.icd_actionsBase) return window.icd_actionsBase();
  const p = window.location.pathname;
  const i = p.indexOf('/frontend/');
  return i !== -1 ? p.substring(0, i) : '';
}
function getHdr() {
  const h = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
  const t = localStorage.getItem('icd_token');
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadCampaigns() {
  const res = await fetch(getBase() + '/actions/admin_campaigns.php', { credentials: 'include', headers: getHdr() });
  const data = await res.json();
  const tbody = document.getElementById('campaigns-tbody');
  const list = data.campaigns || [];
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:32px;text-align:center;color:#64748B;">No campaigns created yet. Create a legitimate campaign to track verified community progress.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(c => `
    <tr style="border-bottom:1px solid #F1F5F9;">
      <td style="padding:12px 14px;"><strong>${esc(c.title)}</strong><div style="font-size:11.5px;color:#64748B;">${esc(c.description)}</div></td>
      <td style="padding:12px 14px;">${esc(c.category || 'General')}</td>
      <td style="padding:12px 14px;">${c.verified_quantity} / ${c.target_quantity} ${esc(c.target_unit)} (${c.progress_percent}%)</td>
      <td style="padding:12px 14px;font-size:12px;">${esc(c.start_date || '—')} to ${esc(c.end_date || '—')}</td>
      <td style="padding:12px 14px;"><span class="badge badge-neutral">${esc(c.status)}</span></td>
      <td style="padding:12px 14px;text-align:right;">
        ${c.status !== 'archived' ? `<button class="btn btn-outline" style="font-size:11.5px;padding:4px 8px;" onclick="archiveCampaign(${c.id})">Archive</button>` : '—'}
      </td>
    </tr>
  `).join('');
}

document.getElementById('camp-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const res = await fetch(getBase() + '/actions/admin_campaigns.php', {
    method: 'POST', credentials: 'include', headers: getHdr(),
    body: JSON.stringify({
      action: 'create',
      title: document.getElementById('c-title').value.trim(),
      description: document.getElementById('c-desc').value.trim(),
      target_quantity: parseInt(document.getElementById('c-target').value, 10),
      target_unit: document.getElementById('c-unit').value.trim(),
      start_date: document.getElementById('c-start').value,
      end_date: document.getElementById('c-end').value
    })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById('camp-dialog').close();
    this.reset();
    loadCampaigns();
  } else {
    alert(data.message || 'Failed to create campaign.');
  }
});

async function archiveCampaign(id) {
  const res = await fetch(getBase() + '/actions/admin_campaigns.php', {
    method: 'POST', credentials: 'include', headers: getHdr(),
    body: JSON.stringify({ action: 'archive', id })
  });
  const data = await res.json();
  if (data.success) loadCampaigns();
}

document.addEventListener('DOMContentLoaded', loadCampaigns);
</script>
</body>
</html>
