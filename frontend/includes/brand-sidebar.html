<!-- frontend/includes/brand-sidebar.html
     Reusable iCareDonate Sidebar/Header Brand Component
     Note: In HTML pages, this component is embedded directly or loaded via include.
-->
<div class="brand-sidebar-container" role="banner">
  <a href="../index.html" class="brand-sidebar-logo" aria-label="iCareDonate">
    <!-- Heart-shaped icon: royal blue (#1E4DA1) with white handshake -->
    <img src="../assets/images/logo.svg"
         class="brand-sidebar-icon"
         alt="iCareDonate Logo"
         width="32"
         height="32">
    <!-- Wordmark: "i" in blue (#1E4DA1), "Care" in amber (#F2B84B), "Donate" in blue (#1E4DA1) -->
    <span class="brand-sidebar-wordmark">
      <span class="brand-split-blue">i</span><span class="brand-split-orange">Care</span><span class="brand-split-blue">Donate</span>
    </span>
  </a>
</div>
