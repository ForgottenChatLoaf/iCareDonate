<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging Out | iCareDonate</title>
  <meta http-equiv="refresh" content="1; url=login.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-primary, #F8FAFC);
      font-family: var(--font-body, system-ui, sans-serif);
      color: var(--text-primary, #1E293B);
    }
    .logout-box {
      background: #FFFFFF;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 380px;
      width: 90%;
      border: 1px solid var(--border-color, #E2E8F0);
    }
    .logout-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(31,79,163,0.15);
      border-top-color: var(--cobalt, #1F4FA3);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    try {
      localStorage.removeItem('icd_token');
      localStorage.removeItem('icd_user');
      localStorage.removeItem('icd_session');
      sessionStorage.clear();
      document.cookie.split(";").forEach(function(c) {
        document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
      });
    } catch(e) {}
    setTimeout(function() {
      window.location.replace('login.html');
    }, 600);
  </script>
</head>
<body>
  <div class="logout-box">
    <div class="logout-spinner"></div>
    <h2 style="font-size: 1.25rem; margin-bottom: 8px;">Logging you out...</h2>
    <p style="font-size: 13.5px; color: #64748B; margin-bottom: 16px;">Clearing secure prototype session.</p>
    <a href="login.html" style="font-size: 13px; color: var(--cobalt, #1F4FA3); text-decoration: underline;">Click here if not redirected</a>
  </div>
</body>
</html>
